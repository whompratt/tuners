# Release-manifest variant: identical to io.github.whompratt.tuners.yml
# except the deb comes from the published GitHub release asset (url +
# sha256) instead of a local build — reproduces any shipped version
# without a Rust/Node toolchain. Update BOTH the url and sha256 when
# pointing at a new release:
#   curl -sL <url> | sha256sum
id: io.github.whompratt.tuners
branch: stable
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: tuners-app
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # UDP telemetry listen + collect uploads + (gated) updater feed
  - --share=network
modules:
  - name: tuners
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/whompratt/tuners/releases/download/v0.1.4/tuners_0.1.4_amd64.deb
        sha256: d98e3dbf1c6bd29a8d1d97f4529f734a43fccd30f54bc7100e70849dcdad5d1a
        dest-filename: tuners.deb
    build-commands:
      - ar -x tuners.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/tuners-app /app/bin/tuners-app
      - install -Dm644 usr/share/applications/tuners.desktop /app/share/applications/io.github.whompratt.tuners.desktop
      - desktop-file-edit --set-icon=io.github.whompratt.tuners /app/share/applications/io.github.whompratt.tuners.desktop
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/tuners-app.png /app/share/icons/hicolor/128x128/apps/io.github.whompratt.tuners.png
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/tuners-app.png /app/share/icons/hicolor/32x32/apps/io.github.whompratt.tuners.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/tuners-app.png /app/share/icons/hicolor/256x256@2/apps/io.github.whompratt.tuners.png
