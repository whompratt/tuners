<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tuners</title>
<style>
  :root {
    color-scheme: dark;
    /* reference dataviz dark tokens */
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #c98500;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink-2);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; height: 100vh;
  }
  aside {
    width: 320px; min-width: 240px; border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto;
  }
  aside h1 { font-size: 16px; color: var(--ink); margin-bottom: 12px; }
  aside h1 span { color: var(--muted); font-weight: normal; font-size: 12px; }
  .session {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 8px; cursor: pointer; word-break: break-all; font-size: 13px;
    position: relative;
  }
  .session:hover { border-color: var(--accent); }
  .session.active { border-color: var(--accent); background: var(--surface); }
  .session .size { color: var(--muted); font-size: 12px; }
  .ab { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
  .ab button {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--muted); font: 600 11px system-ui; width: 22px; height: 20px;
    cursor: pointer; padding: 0;
  }
  .ab button.on-a { border-color: #3987e5; color: #3987e5; }
  .ab button.on-b { border-color: #199e70; color: #199e70; }
  #car-filter {
    width: 100%; margin-bottom: 10px; padding: 6px 8px;
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 6px; font: 13px system-ui;
  }
  .session .car { color: var(--accent); font-size: 12px; }
  .sector {
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
    font-size: 12px;
  }
  .sector .num { font-variant-numeric: tabular-nums; color: var(--ink); }
  main { flex: 1; padding: 16px 24px; overflow: auto; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin-bottom: 16px;
    position: relative;
  }
  .panel h2 { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-bottom: 8px; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; font-size: 12px; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #canvas-wrap { position: relative; }
  canvas { width: 100%; display: block; }
  .tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--ink-2); white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 2;
  }
  .tip .t-head { color: var(--muted); margin-bottom: 2px; }
  .tip .num { font-variant-numeric: tabular-nums; color: var(--ink); }
  pre { white-space: pre-wrap; font: 13px/1.45 ui-monospace, Consolas, monospace; }
  .placeholder { color: var(--muted); }
  #live-panel.stale { opacity: 0.55; }
  #rec-split {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--ink-2); font: 12px system-ui; padding: 4px 10px; cursor: pointer;
  }
  #rec-split:hover { border-color: var(--accent); color: var(--ink); }
  #rec-status .rec-dot { color: #e66767; }
  .live-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .live-head .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    align-self: center;
  }
  #live-panel:not(.stale) .live-head .dot { background: #199e70; }
  .live-row { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: flex-end; }
  .readout .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .readout .value { font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }
  .readout .unit { font-size: 12px; color: var(--muted); }
  .readout.minor .value { font-size: 16px; }
  .temps { display: grid; grid-template-columns: repeat(2, 52px); gap: 3px; }
  .temps div {
    text-align: center; font-size: 12px; font-variant-numeric: tabular-nums;
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 0;
  }
  .temps .cold { color: #3987e5; } .temps .hot { color: #e66767; }
  .live-body { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .live-body .live-row { flex: 1; min-width: 320px; }
  #live-quality {
    flex: none; display: flex; align-items: center; gap: 16px;
    border: 1px solid var(--qcolor); border-radius: 8px; padding: 10px 14px;
    background: color-mix(in srgb, var(--qcolor) 14%, transparent);
    --qcolor: #e66767; /* low */
  }
  #live-quality.q-ok { --qcolor: #c98500; }
  #live-quality.q-good { --qcolor: #199e70; }
  #live-quality svg { flex: none; }
  .q-track { fill: none; stroke: var(--grid); stroke-width: 10; stroke-linecap: round; }
  .q-fill {
    fill: none; stroke: var(--qcolor); stroke-width: 10; stroke-linecap: round;
    transition: stroke-dasharray 0.4s, stroke 0.4s;
  }
  #q-pct { fill: var(--ink); font: 600 20px system-ui; text-anchor: middle; }
  #q-caption { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #q-detail { font-size: 12px; color: var(--ink-2); }
  #q-detail .num { font-variant-numeric: tabular-nums; color: var(--ink); }
  #q-label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
</style>
</head>
<body>
  <aside>
    <h1>tuners <span>FH6 tuning assistant</span></h1>
    <select id="car-filter"></select>
    <div id="sessions"></div>
  </aside>
  <main>
    <div id="live-panel" class="panel" style="display:none">
      <div class="live-head">
        <span class="dot"></span>
        <h2 style="margin:0">Live</h2>
        <span id="live-file" style="font-size:12px;color:var(--muted)"></span>
        <span id="live-status" style="font-size:12px;color:var(--muted)"></span>
        <span style="flex:1"></span>
        <span id="rec-status" style="font-size:12px;color:var(--muted)"></span>
        <button id="rec-split" style="display:none">new session — tune changed</button>
      </div>
      <div class="live-body">
      <div id="live-quality">
        <svg viewBox="0 0 100 62" width="120" aria-label="data confidence">
          <path class="q-track" d="M 10 52 A 40 40 0 0 1 90 52"/>
          <path class="q-fill" id="q-fill" d="M 10 52 A 40 40 0 0 1 90 52" stroke-dasharray="0 999"/>
          <text id="q-pct" x="50" y="50">–</text>
        </svg>
        <div>
          <div id="q-label">confidence</div>
          <div id="q-detail">no complete laps yet</div>
          <div id="q-caption">share of the ideal lap reproduced by a second lap</div>
        </div>
      </div>
      <div class="live-row">
        <div class="readout"><div class="label">Speed</div>
          <div class="value"><span id="lv-speed">–</span> <span class="unit">mph</span></div></div>
        <div class="readout"><div class="label">Gear</div>
          <div class="value" id="lv-gear">–</div></div>
        <div class="readout"><div class="label">RPM</div>
          <div class="value"><span id="lv-rpm">–</span> <span class="unit" id="lv-maxrpm"></span></div></div>
        <div class="readout minor"><div class="label">Lap</div>
          <div class="value" id="lv-lap">–</div></div>
        <div class="readout minor"><div class="label">Last</div>
          <div class="value" id="lv-last">–</div></div>
        <div class="readout minor"><div class="label">Best</div>
          <div class="value" id="lv-best">–</div></div>
        <div class="readout minor"><div class="label">Fuel</div>
          <div class="value" id="lv-fuel">–</div></div>
        <div class="readout"><div class="label">Tires °F</div>
          <div class="temps" id="lv-temps"><div>–</div><div>–</div><div>–</div><div>–</div></div></div>
      </div>
      </div>
    </div>
    <div id="compare-panel" style="display:none" class="panel">
      <h2 id="compare-title">A/B comparison</h2>
      <div id="compare-summary" style="font-size:12px;color:var(--ink-2);margin-bottom:8px"></div>
      <div id="compare-sectors" class="legend-row"></div>
      <div id="compare-legend" class="legend-row"></div>
      <div id="compare-wrap" style="position:relative">
        <canvas id="compare-chart" height="530"></canvas>
        <div id="compare-tip" class="tip"></div>
      </div>
    </div>
    <div id="chart-panel" class="panel" style="display:none">
      <h2>Speed by distance — flying laps</h2>
      <div id="legend" class="legend-row"></div>
      <div id="canvas-wrap">
        <canvas id="chart" height="320"></canvas>
        <div id="tooltip" class="tip"></div>
      </div>
    </div>
    <pre id="report" class="placeholder">select a session</pre>
  </main>
<script>
// reference dark categorical palette (validated, fixed order — never cycled)
const SERIES = ['#3987e5', '#008300', '#d55181', '#c98500', '#199e70', '#d95926', '#9085e9', '#e66767'];
const MPH = 2.23694;
let lapData = null;

const fmtLap = s => {
  const ms = Math.round(s * 1000), m = Math.floor(ms / 60000), r = ms % 60000;
  const sec = (r / 1000).toFixed(3).padStart(6, '0');
  return m > 0 ? `${m}:${sec}` : (r / 1000).toFixed(3);
};

let allSessions = [];
async function load() {
  allSessions = await fetch('/api/sessions').then(r => r.json());
  const filter = document.getElementById('car-filter');
  if (!allSessions.length) {
    document.getElementById('sessions').innerHTML =
      '<div class="placeholder">no .ftel sessions found — record one with `tuners capture`</div>';
    filter.style.display = 'none';
    return;
  }
  const carLabel = s => s.carName || `car #${s.car}`;
  const cars = new Map(); // ordinal -> label, insertion-ordered
  for (const s of allSessions) cars.set(s.car, carLabel(s));
  filter.innerHTML = `<option value="all">all cars (${allSessions.length} sessions)</option>` +
    [...cars].map(([ord, label]) => `<option value="${ord}">${label}</option>`).join('');
  // default: the latest session's car (list is filename-sorted = chronological)
  filter.value = String(allSessions[allSessions.length - 1].car);
  filter.onchange = renderSessions;
  renderSessions();
}

function renderSessions() {
  const filter = document.getElementById('car-filter').value;
  const list = document.getElementById('sessions');
  list.innerHTML = '';
  const shown = allSessions.filter(s => filter === 'all' || String(s.car) === filter);
  if (!shown.length) {
    list.innerHTML = '<div class="placeholder">no sessions for this car</div>';
    return;
  }
  for (const s of [...shown].reverse()) {
    const el = document.createElement('div');
    el.className = 'session';
    el.innerHTML = `${s.file.split('/').pop()}<br>` +
      `<span class="car">${s.carName || `car #${s.car}`}</span> · ` +
      `<span class="size">${(s.bytes / 1e6).toFixed(1)} MB</span>` +
      `<span class="ab"><button data-side="a" title="compare as A">A</button>` +
      `<button data-side="b" title="compare as B">B</button></span>`;
    if (s.file === sel.a) el.querySelector('[data-side=a]').classList.add('on-a');
    if (s.file === sel.b) el.querySelector('[data-side=b]').classList.add('on-b');
    el.onclick = () => show(s.file, el);
    el.querySelectorAll('.ab button').forEach(btn => {
      btn.onclick = ev => { ev.stopPropagation(); pick(btn.dataset.side, s.file, btn); };
    });
    list.appendChild(el);
  }
}

// --- A/B comparison ---
const sel = { a: null, b: null };
function pick(side, file, btn) {
  const cls = side === 'a' ? 'on-a' : 'on-b';
  const was = sel[side] === file;
  document.querySelectorAll(`.ab button[data-side=${side}]`).forEach(b => b.classList.remove(cls));
  sel[side] = was ? null : file;
  if (!was) btn.classList.add(cls);
  updateCompare();
}

let cmpData = null;
async function updateCompare() {
  const panel = document.getElementById('compare-panel');
  if (!sel.a || !sel.b) { panel.style.display = 'none'; cmpData = null; return; }
  const resp = await fetch(`/api/compare?a=${encodeURIComponent(sel.a)}&b=${encodeURIComponent(sel.b)}`);
  const summary = document.getElementById('compare-summary');
  if (!resp.ok) {
    panel.style.display = 'block';
    document.getElementById('compare-legend').innerHTML = '';
    summary.textContent = `cannot compare: ${await resp.text()}`;
    document.getElementById('compare-chart').getContext('2d').clearRect(0, 0, 4000, 4000);
    cmpData = null;
    return;
  }
  cmpData = await resp.json();
  panel.style.display = 'block';
  const ideal = cmpData.b.ideal - cmpData.a.ideal;
  const best = cmpData.b.best - cmpData.a.best;
  const word = d => Math.abs(d) < 0.01 ? 'even' : d < 0 ? `B faster by ${(-d).toFixed(2)}s` : `A faster by ${d.toFixed(2)}s`;
  summary.innerHTML =
    `best lap: <span class="num">${word(best)}</span> · ideal (spliced): <span class="num">${word(ideal)}</span>` +
    (cmpData.unequalLaps ? ' · <span style="color:var(--muted)">note: unequal lap counts bias the ideal toward the session with more laps</span>' : '') +
    (cmpData.carMismatch ? ' · <span style="color:var(--muted)">note: different cars — this compares cars, not tunes</span>' : '');
  document.getElementById('compare-legend').innerHTML = [
    ['#3987e5', 'A', cmpData.a], ['#199e70', 'B', cmpData.b],
  ].map(([c, tag, s]) =>
    `<span><span class="chip" style="background:${c}"></span>${tag}: ${s.file.split('/').pop()} — ` +
    `best <span class="num">${fmtLap(s.best)}</span>, ideal <span class="num">${fmtLap(s.ideal)}</span> (${s.laps} laps)</span>`
  ).join('');
  renderSectors();
  drawCompare();
}

// Garage61-style sector gaps: thirds of the route, A's ideal sector time plus
// B's delta, tinted by the gainer's identity color with intensity ~ magnitude.
const N_SECTORS = 3;
function renderSectors() {
  const bins = cmpData.delta.length;
  const per = Math.ceil(bins / N_SECTORS);
  const sectors = [];
  for (let s = 0; s < N_SECTORS; s++) {
    const lo = s * per, hi = Math.min((s + 1) * per, bins);
    sectors.push({
      aTime: cmpData.timesA.slice(lo, hi).reduce((x, y) => x + y, 0),
      delta: cmpData.delta.slice(lo, hi).reduce((x, y) => x + y, 0),
    });
  }
  const maxAbs = Math.max(0.01, ...sectors.map(s => Math.abs(s.delta)));
  document.getElementById('compare-sectors').innerHTML = sectors.map((s, i) => {
    const gain = s.delta < 0 ? 'B' : 'A';                 // negative: B quicker
    const color = s.delta < 0 ? '25,158,112' : '57,135,229';
    const alpha = 0.12 + 0.45 * (Math.abs(s.delta) / maxAbs);
    return `<span class="sector" style="background:rgba(${color},${alpha.toFixed(2)})">` +
      `S${i + 1} · A <span class="num">${s.aTime.toFixed(3)}s</span> · ` +
      `${gain} <span class="num">−${Math.abs(s.delta).toFixed(3)}s</span></span>`;
  }).join('');
}

const SEG_BINS = 25; // 250m segments for the delta bars
function compareLayout() {
  const canvas = document.getElementById('compare-chart');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth, cssH = 530;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = { l: 46, r: 12, t: 8, b: 24 };
  const bins = cmpData.delta.length;
  const speedH = 210, gapH = 24, barsH = 80, cumH = 140;
  const segs = [];
  for (let s = 0; s < bins; s += SEG_BINS) {
    segs.push(cmpData.delta.slice(s, s + SEG_BINS).reduce((x, y) => x + y, 0));
  }
  const cum = [];
  let acc = 0;
  for (const d of cmpData.delta) { acc += d; cum.push(acc); }
  return { ctx, cssW, cssH, pad, bins, speedH, gapH, barsH, cumH,
    plotW: cssW - pad.l - pad.r,
    yMax: Math.ceil(Math.max(...cmpData.speedsA, ...cmpData.speedsB) * MPH / 20) * 20,
    segs, segMax: Math.max(0.05, ...segs.map(Math.abs)),
    cum, cumMax: Math.max(0.1, ...cum.map(Math.abs)) };
}

function drawCompare(hoverBin) {
  const L = compareLayout();
  const { ctx, cssW, pad, bins, plotW, yMax, speedH, gapH, barsH, cumH, segs, segMax, cum, cumMax } = L;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const x = bin => pad.l + (bin / (bins - 1)) * plotW;
  const ySpeed = mph => pad.t + speedH - (mph / yMax) * speedH;
  const bars0 = pad.t + speedH + gapH + barsH / 2;
  const yBars = d => bars0 - (d / segMax) * (barsH / 2);
  const cumTop = pad.t + speedH + gapH + barsH + gapH;
  const cum0 = cumTop + cumH / 2;
  const yCum = d => cum0 - (-d / cumMax) * (cumH / 2); // up = B ahead (delta sum negative)
  ctx.clearRect(0, 0, cssW, L.cssH);
  ctx.font = '11px system-ui, sans-serif';

  ctx.lineWidth = 1;
  for (let g = 0; g <= yMax; g += 40) {
    ctx.strokeStyle = css('--grid');
    ctx.beginPath(); ctx.moveTo(pad.l, ySpeed(g)); ctx.lineTo(cssW - pad.r, ySpeed(g)); ctx.stroke();
    ctx.fillStyle = css('--muted'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${g}`, pad.l - 8, ySpeed(g));
  }
  ctx.save(); ctx.translate(11, pad.t + speedH / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.fillText('mph', 0, 0); ctx.restore();

  [[cmpData.speedsA, '#3987e5'], [cmpData.speedsB, '#199e70']].forEach(([speeds, color]) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    speeds.forEach((v, b) => b ? ctx.lineTo(x(b), ySpeed(v * MPH)) : ctx.moveTo(x(b), ySpeed(v * MPH)));
    ctx.stroke();
  });

  // Per-250m delta bars, in the color of the FASTER setup through that segment.
  ctx.strokeStyle = css('--baseline');
  ctx.beginPath(); ctx.moveTo(pad.l, bars0); ctx.lineTo(cssW - pad.r, bars0); ctx.stroke();
  segs.forEach((d, i) => {
    const x0 = x(i * SEG_BINS), x1 = x(Math.min((i + 1) * SEG_BINS, bins - 1));
    ctx.fillStyle = d < 0 ? '#199e70' : '#3987e5'; // negative: B took less time
    const y0 = yBars(Math.max(d, 0)), y1 = yBars(Math.min(d, 0));
    ctx.fillRect(x0 + 1, y0, Math.max(1, x1 - x0 - 2), Math.max(1, y1 - y0));
  });
  ctx.fillStyle = css('--muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Δ per 250 m — bar in the color of the faster setup there', pad.l, pad.t + speedH + gapH / 2);
  ctx.textAlign = 'right';
  ctx.fillText(`±${segMax.toFixed(2)}s`, pad.l - 8, bars0);

  // Cumulative gap: A is the flat reference line; the curve is B relative to it
  // (above the line = B ahead). Fill tinted by whoever is ahead.
  ctx.fillStyle = css('--muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('cumulative gap — A flat, curve = B (above line: B ahead)', pad.l, cumTop - gapH / 2);
  ctx.strokeStyle = '#3987e5'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, cum0); ctx.lineTo(cssW - pad.r, cum0); ctx.stroke();
  ctx.fillStyle = css('--muted'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(`+${cumMax.toFixed(2)}s`, pad.l - 8, yCum(-cumMax));
  ctx.fillText(`-${cumMax.toFixed(2)}s`, pad.l - 8, yCum(cumMax));
  ctx.beginPath();
  cum.forEach((d, b) => b ? ctx.lineTo(x(b), yCum(d)) : ctx.moveTo(x(b), yCum(d)));
  ctx.strokeStyle = '#199e70'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  // sign-split fill between curve and reference
  for (const sign of [1, -1]) {
    ctx.beginPath(); ctx.moveTo(x(0), cum0);
    cum.forEach((d, b) => {
      const v = sign > 0 ? Math.min(d, 0) : Math.max(d, 0); // d<0 = B ahead
      ctx.lineTo(x(b), yCum(v));
    });
    ctx.lineTo(x(bins - 1), cum0); ctx.closePath();
    ctx.fillStyle = sign > 0 ? 'rgba(25,158,112,0.18)' : 'rgba(57,135,229,0.18)';
    ctx.fill();
  }

  ctx.fillStyle = css('--muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const kmMax = bins * cmpData.binMeters / 1000;
  for (let km = 0; km <= kmMax; km += 1) {
    ctx.fillText(`${km} km`, x(km * 1000 / cmpData.binMeters), L.cssH - pad.b + 6);
  }

  if (hoverBin != null) {
    ctx.strokeStyle = css('--baseline'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x(hoverBin), pad.t); ctx.lineTo(x(hoverBin), L.cssH - pad.b); ctx.stroke();
  }
}

document.getElementById('compare-wrap').addEventListener('mousemove', ev => {
  if (!cmpData) return;
  const rect = document.getElementById('compare-chart').getBoundingClientRect();
  // compareLayout() resizes the canvas, which CLEARS it — call it once, before
  // drawCompare, never after.
  const { pad, plotW, bins, segs, cum } = compareLayout();
  const px = ev.clientX - rect.left;
  if (px < pad.l || px > pad.l + plotW) { drawCompare(); cmpTip(null); return; }
  const bin = Math.round(((px - pad.l) / plotW) * (bins - 1));
  drawCompare(bin);
  const seg = segs[Math.floor(bin / SEG_BINS)] ?? 0;
  const gap = cum[bin] ?? 0; // negative = B ahead
  const tip = document.getElementById('compare-tip');
  tip.innerHTML =
    `<div class="t-head">${(bin * cmpData.binMeters / 1000).toFixed(2)} km</div>` +
    `<div><span class="chip" style="background:#3987e5"></span>A <span class="num">${(cmpData.speedsA[bin] * MPH).toFixed(0)} mph</span></div>` +
    `<div><span class="chip" style="background:#199e70"></span>B <span class="num">${(cmpData.speedsB[bin] * MPH).toFixed(0)} mph</span></div>` +
    `<div>this 250 m: <span class="num">${seg < 0 ? 'B' : 'A'} quicker by ${Math.abs(seg).toFixed(2)}s</span></div>` +
    `<div>gap so far: <span class="num">${gap < 0 ? 'B' : 'A'} ahead by ${Math.abs(gap).toFixed(2)}s</span></div>`;
  tip.style.display = 'block';
  const wrap = document.getElementById('compare-wrap').getBoundingClientRect();
  tip.style.left = px > wrap.width - 200 ? `${px - tip.offsetWidth - 12}px` : `${px + 12}px`;
  tip.style.top = `${Math.max(0, ev.clientY - rect.top - 20)}px`;
});
document.getElementById('compare-wrap').addEventListener('mouseleave', () => {
  if (cmpData) { drawCompare(); cmpTip(null); }
});
function cmpTip(bin) {
  if (bin == null) document.getElementById('compare-tip').style.display = 'none';
}

async function show(file, el) {
  document.querySelectorAll('.session').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  const report = document.getElementById('report');
  report.classList.remove('placeholder');
  report.textContent = 'analyzing…';
  const [reportText, lapsResp] = await Promise.all([
    fetch(`/api/report?file=${encodeURIComponent(file)}`).then(r => r.text()),
    fetch(`/api/laps?file=${encodeURIComponent(file)}`),
  ]);
  report.textContent = reportText;
  const panel = document.getElementById('chart-panel');
  if (lapsResp.ok) {
    lapData = await lapsResp.json();
    if (lapData.laps.length) { panel.style.display = 'block'; drawChart(); return; }
  }
  lapData = null;
  panel.style.display = 'none';
}

function layout() {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth, cssH = 320;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = { l: 46, r: 12, t: 8, b: 26 };
  const bins = Math.max(...lapData.laps.map(l => l.speeds.length));
  const maxMph = Math.max(...lapData.laps.flatMap(l => l.speeds)) * MPH;
  return { ctx, cssW, cssH, pad,
    plotW: cssW - pad.l - pad.r, plotH: cssH - pad.t - pad.b,
    bins, kmMax: bins * lapData.binMeters / 1000, yMax: Math.ceil(maxMph / 20) * 20 };
}

function drawChart(hoverBin) {
  const { ctx, cssW, cssH, pad, plotW, plotH, bins, kmMax, yMax } = layout();
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const x = bin => pad.l + (bin / (bins - 1)) * plotW;
  const y = mph => pad.t + plotH - (mph / yMax) * plotH;
  ctx.clearRect(0, 0, cssW, cssH);

  ctx.font = '11px system-ui, sans-serif';
  ctx.lineWidth = 1;
  for (let g = 0; g <= yMax; g += 40) {           // horizontal grid + labels
    ctx.strokeStyle = css('--grid');
    ctx.beginPath(); ctx.moveTo(pad.l, y(g)); ctx.lineTo(cssW - pad.r, y(g)); ctx.stroke();
    ctx.fillStyle = css('--muted');
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${g}`, pad.l - 8, y(g));
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let km = 0; km <= kmMax; km += 1) {
    ctx.fillText(`${km} km`, x(km * 1000 / lapData.binMeters), pad.t + plotH + 8);
  }
  ctx.save();                                      // y-axis unit
  ctx.translate(11, pad.t + plotH / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('mph', 0, 0);
  ctx.restore();
  ctx.strokeStyle = css('--baseline');             // baseline
  ctx.beginPath(); ctx.moveTo(pad.l, y(0)); ctx.lineTo(cssW - pad.r, y(0)); ctx.stroke();

  lapData.laps.forEach((lap, i) => {               // 2px series lines
    ctx.strokeStyle = SERIES[i % SERIES.length];
    ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    lap.speeds.forEach((v, b) => b ? ctx.lineTo(x(b), y(v * MPH)) : ctx.moveTo(x(b), y(v * MPH)));
    ctx.stroke();
  });

  if (hoverBin != null) {                          // crosshair
    ctx.strokeStyle = css('--baseline');
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x(hoverBin), pad.t); ctx.lineTo(x(hoverBin), pad.t + plotH); ctx.stroke();
  }

  const best = Math.min(...lapData.laps.filter(l => !l.standing).map(l => l.time));
  document.getElementById('legend').innerHTML = lapData.laps.map((lap, i) =>
    `<span><span class="chip" style="background:${SERIES[i % SERIES.length]}"></span>` +
    `lap ${lap.lap} — <span class="num">${fmtLap(lap.time)}</span>` +
    `${lap.standing ? ' (standing start)' : lap.time === best ? ' (best)' : ''}</span>`
  ).join('');
}

document.getElementById('canvas-wrap').addEventListener('mousemove', ev => {
  if (!lapData) return;
  const canvas = document.getElementById('chart');
  const rect = canvas.getBoundingClientRect();
  const { pad, plotW, bins } = layout();
  const px = ev.clientX - rect.left;
  if (px < pad.l || px > pad.l + plotW) { drawChart(); tooltip(null); return; }
  const bin = Math.round(((px - pad.l) / plotW) * (bins - 1));
  drawChart(bin);
  tooltip(bin, px, ev.clientY - rect.top);
});
document.getElementById('canvas-wrap').addEventListener('mouseleave', () => {
  if (lapData) { drawChart(); tooltip(null); }
});

function tooltip(bin, px, py) {
  const tip = document.getElementById('tooltip');
  if (bin == null) { tip.style.display = 'none'; return; }
  const km = (bin * lapData.binMeters / 1000).toFixed(2);
  const rows = lapData.laps
    .map((lap, i) => ({ lap, i, mph: (lap.speeds[bin] ?? 0) * MPH }))
    .sort((a, b) => b.mph - a.mph)
    .map(({ lap, i, mph }) =>
      `<div><span class="chip" style="background:${SERIES[i % SERIES.length]}"></span>` +
      `lap ${lap.lap} <span class="num">${mph.toFixed(0)} mph</span></div>`);
  tip.innerHTML = `<div class="t-head">${km} km</div>` + rows.join('');
  tip.style.display = 'block';
  const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
  const flip = px > wrap.width - 170;
  tip.style.left = flip ? `${px - tip.offsetWidth - 12}px` : `${px + 12}px`;
  tip.style.top = `${Math.max(0, py - 20)}px`;
}

window.addEventListener('resize', () => {
  if (lapData) drawChart();
  if (cmpData) drawCompare();
});

// --- live view: SSE from the session `tuners capture` is recording now ---
const STALE_MS = 3000;
const live = new EventSource('/api/live');
let lastRecFile = null;
live.addEventListener('state', ev => {
  const s = JSON.parse(ev.data);
  const rec = s.recorder || { mode: 'external' };
  const panel = document.getElementById('live-panel');
  // Recorder armed or data seen: show the panel so the user knows where things stand.
  if (!s.frame && rec.mode === 'external') return;
  panel.style.display = 'block';

  document.getElementById('rec-status').innerHTML = {
    recording: `<span class="rec-dot">●</span> recording (${rec.packets.toLocaleString()} pkts)`,
    waiting: 'armed — waiting for race telemetry',
    external: 'view-only (external capture owns the UDP port)',
  }[rec.mode] || '';
  document.getElementById('rec-split').style.display = rec.mode === 'recording' ? '' : 'none';
  if (rec.file !== lastRecFile) {             // session rotated: refresh the sidebar
    lastRecFile = rec.file;
    load();
  }

  const stale = s.ageMs == null || s.ageMs > STALE_MS;
  panel.classList.toggle('stale', stale);
  document.getElementById('live-file').textContent = s.file || '';
  document.getElementById('live-status').textContent =
    !s.frame ? '' :
    stale ? `no data for ${Math.round(s.ageMs / 1000)}s` : (s.frame.raceOn ? '' : 'menu / paused');
  const f = s.frame;
  if (!f) return;
  const set = (id, v) => document.getElementById(id).textContent = v;
  set('lv-speed', (f.speedMps * MPH).toFixed(0));
  set('lv-gear', f.gear === 0 ? 'R' : f.gear === 11 ? '–' : f.gear); // 0 = reverse, 11 = transient glitch
  set('lv-rpm', f.rpm.toFixed(0));
  set('lv-maxrpm', `/ ${f.maxRpm.toFixed(0)}`);
  set('lv-lap', `${f.lapNumber + 1} · ${f.currentLapS.toFixed(1)}s`);
  set('lv-last', f.lastLapS > 0 ? fmtLap(f.lastLapS) : '–');
  set('lv-best', f.bestLapS > 0 ? fmtLap(f.bestLapS) : '–');
  set('lv-fuel', `${(f.fuel * 100).toFixed(0)}%`);
  const temps = document.getElementById('lv-temps').children;
  f.tireTempF.forEach((t, i) => {
    temps[i].textContent = t.toFixed(0);
    temps[i].className = t < 160 ? 'cold' : t > 240 ? 'hot' : '';
  });
});
document.getElementById('rec-split').onclick = async () => {
  await fetch('/api/record/split', { method: 'POST' });
  // The recorder closes the file now; the next race-mode frame opens a fresh one.
};
live.addEventListener('quality', ev => {
  const q = JSON.parse(ev.data);
  const ARC = Math.PI * 40;                   // semicircle path length (r=40)
  const pct = q ? q.confidencePct : 0;
  const band = q ? q.band : 'low';
  document.getElementById('live-quality').className =
    band === 'good' ? 'q-good' : band === 'ok' ? 'q-ok' : '';
  document.getElementById('q-fill').setAttribute('stroke-dasharray', `${ARC * pct / 100} 999`);
  document.getElementById('q-pct').textContent = q ? `${pct}%` : '–';
  document.getElementById('q-label').textContent = 'confidence — ' + {
    good: 'enough for a trustworthy A/B',
    ok: 'usable, more laps will firm it up',
    low: 'keep driving',
  }[band];
  document.getElementById('q-detail').innerHTML = !q ? 'no complete laps yet' :
    `<span class="num">${q.laps}</span> ${q.standingOnly ? 'standing run(s)' : 'flying lap(s)'} · ` +
    `best <span class="num">${fmtLap(q.bestLapS)}</span> · ` +
    `spread <span class="num">${q.spreadPct.toFixed(1)}%</span> · ` +
    `<span class="num">${q.sharedKm.toFixed(2)} km</span>`;
});
load();
</script>
