[workspace]
members = ["app/src-tauri"]

[profile.release]
codegen-units = 1
lto = true
strip = true

[package]
name = "tuners"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "2.0.0-rc.22", features = ["derive"] }
zstd = "0.13.3"

[dev-dependencies]
zstd = "0.13.3"
