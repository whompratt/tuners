[workspace]
members = ["app/src-tauri"]

# The single place the app version is bumped: both crates inherit it, and
# tauri.conf.json (no version key) picks it up from the app crate.
[workspace.package]
version = "0.1.13"

[profile.release]
codegen-units = 1
lto = true
strip = true

[package]
name = "tuners"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# Already in the tree under ureq's rustls; direct dep for priors signing.
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
ureq = "2"
zstd = "0.13.3"

[dev-dependencies]
zstd = "0.13.3"
