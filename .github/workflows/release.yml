# Release builds: push a `v*` tag to build the desktop app
# for Windows (NSIS + MSI) and Linux (AppImage + deb + rpm + flatpak) and
# attach the installers plus signed updater artifacts (latest.json) to a
# GitHub release with auto-generated notes. The release is created as a draft and published
# automatically only after BOTH platform builds succeed: the updater feed
# reads releases/latest, which must never see a half-uploaded release.
# Signing needs the TAURI_SIGNING_PRIVATE_KEY secret (keypair at
# ~/.tauri/tuners.key on the dev machine; losing it orphans shipped installs).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # The version lives in ONE place: [workspace.package] in the root
      # Cargo.toml (tauri.conf.json has no version key and inherits it).
      # Refuse to release a tag that doesn't match it — catches tagging
      # before bumping, which once shipped a v0.1.1 that reported 0.1.0.
      - name: check tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag != Cargo.toml version $version - bump the version, commit, then re-tag" >&2
            exit 1
          fi

      - uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            // Idempotent: a draft for this tag left by an earlier attempt
            // (failed run, re-pushed tag) is reused; same-version assets
            // get replaced by name on upload.
            const existing = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            if (existing.data.some(r => r.tag_name === tag && r.draft)) {
              return;
            }
            const dl = (name) =>
              `[${name}](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${name})`;
            const body = [
              '## Downloads',
              '',
              '| Platform | File |',
              '| --- | --- |',
              `| Windows (recommended) | ${dl(`tuners_${version}_x64-setup.exe`)} |`,
              `| Windows (MSI) | ${dl(`tuners_${version}_x64_en-US.msi`)} |`,
              `| Linux (portable) | ${dl(`tuners_${version}_amd64.AppImage`)} |`,
              `| Linux (Flatpak) | ${dl(`tuners_${version}_amd64.flatpak`)} |`,
              `| Linux (Debian/Ubuntu) | ${dl(`tuners_${version}_amd64.deb`)} |`,
              `| Linux (Fedora) | ${dl(`tuners-${version}-1.x86_64.rpm`)} |`,
              '',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `tuners ${tag}`,
              body,
              draft: true,
              generate_release_notes: true,
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Resolve the tag's draft release at the point of use instead of
      # trusting the id minted by create-release: a re-run of failed jobs
      # after the draft was deleted, or stale drafts left by a
      # delete-and-retag, otherwise 404 the asset upload. Newest release
      # for the tag wins.
      - id: release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const rel = data
              .filter(r => r.tag_name === tag)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (!rel) {
              throw new Error(
                `no release found for ${tag}; the draft was deleted - re-run ` +
                `ALL jobs (or re-push the tag) so create-release makes a new one`
              );
            }
            return rel.id;

      - name: install linux webview/bundler deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: app

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ steps.release.outputs.result }}

      - name: hand the deb to the flatpak job
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/release/bundle/deb/*.deb

  # Repackages the Linux deb as a flatpak bundle and attaches it to the
  # release. The manifest builds from the deb by relative path, so the
  # artifact is dropped in the same spot the local build uses.
  flatpak:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: target/release/bundle/deb

      - name: install flatpak tooling and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: build flatpak bundle
        run: |
          DEB=$(basename target/release/bundle/deb/tuners_*_amd64.deb)
          # the manifest pins the versioned deb filename; point it at this build's
          sed -i "s|tuners_[0-9][^_]*_amd64\.deb|$DEB|" flatpak/io.github.whompratt.tuners.yml
          cd flatpak
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo flatpak-repo build-dir io.github.whompratt.tuners.yml
          flatpak build-bundle flatpak-repo "${DEB%.deb}.flatpak" io.github.whompratt.tuners stable

      - name: attach bundle to the release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const rel = data
              .filter(r => r.tag_name === tag)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (!rel) throw new Error(`no release found for ${tag}`);
            const name = fs.readdirSync('flatpak').find(f => f.endsWith('.flatpak'));
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.id,
              name,
              data: fs.readFileSync(`flatpak/${name}`),
            });

  publish:
    needs: [create-release, build, flatpak]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const same = data
              .filter(r => r.tag_name === tag)
              .sort((a, b) => b.created_at.localeCompare(a.created_at));
            if (!same.length) throw new Error(`no release found for ${tag}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: same[0].id,
              draft: false,
            });
            // Stale drafts for the same tag (delete-and-retag leftovers)
            // would shadow future lookups; drop them now that the real
            // release is published.
            for (const r of same.slice(1)) {
              if (r.draft) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: r.id,
                });
              }
            }
