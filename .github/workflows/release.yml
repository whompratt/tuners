# Release builds: push a `v*` tag to build the desktop app
# for Windows (NSIS + MSI) and Linux (AppImage + deb + rpm + flatpak) and
# attach the installers plus signed updater artifacts (latest.json) to a
# GitHub release with auto-generated notes. The release is created as a draft and published
# automatically only after BOTH platform builds succeed: the updater feed
# reads releases/latest, which must never see a half-uploaded release.
# Signing needs the TAURI_SIGNING_PRIVATE_KEY secret (keypair at
# ~/.tauri/tuners.key on the dev machine; losing it orphans shipped installs).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const dl = (name) =>
              `[${name}](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${name})`;
            const body = [
              '## Downloads',
              '',
              '| Platform | File |',
              '| --- | --- |',
              `| Windows (recommended) | ${dl(`tuners_${version}_x64-setup.exe`)} |`,
              `| Windows (MSI) | ${dl(`tuners_${version}_x64_en-US.msi`)} |`,
              `| Linux (portable) | ${dl(`tuners_${version}_amd64.AppImage`)} |`,
              `| Linux (Flatpak) | ${dl(`tuners_${version}_amd64.flatpak`)} |`,
              `| Linux (Debian/Ubuntu) | ${dl(`tuners_${version}_amd64.deb`)} |`,
              `| Linux (Fedora) | ${dl(`tuners-${version}-1.x86_64.rpm`)} |`,
              '',
              'The `.sig` files and `latest.json` are used by the in-app updater; no need to download them.',
              '',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `tuners ${tag}`,
              body,
              draft: true,
              generate_release_notes: true,
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install linux webview/bundler deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: app

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: hand the deb to the flatpak job
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/release/bundle/deb/*.deb

  # Repackages the Linux deb as a flatpak bundle and attaches it to the
  # release. The manifest builds from the deb by relative path, so the
  # artifact is dropped in the same spot the local build uses.
  flatpak:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: target/release/bundle/deb

      - name: install flatpak tooling and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: build flatpak bundle
        run: |
          DEB=$(basename target/release/bundle/deb/tuners_*_amd64.deb)
          # the manifest pins the versioned deb filename; point it at this build's
          sed -i "s|tuners_[0-9][^_]*_amd64\.deb|$DEB|" flatpak/io.github.whompratt.tuners.yml
          cd flatpak
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo flatpak-repo build-dir io.github.whompratt.tuners.yml
          flatpak build-bundle flatpak-repo "${DEB%.deb}.flatpak" io.github.whompratt.tuners stable

      - name: attach bundle to the release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const name = fs.readdirSync('flatpak').find(f => f.endsWith('.flatpak'));
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name,
              data: fs.readFileSync(`flatpak/${name}`),
            });

  publish:
    needs: [create-release, build, flatpak]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
