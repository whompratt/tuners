# On-push gate: fmt, clippy, tests, and a release-profile build of the
# whole workspace (frontend included). The release workflow only builds on
# tags, so without this a broken release build stays invisible until
# tagging — a dependency downgrade once broke the app build exactly that
# way and was only caught by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: app

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # The bindings are generated by a test; drift between the committed
      # file and the generator is a contract break the frontend would only
      # discover at runtime.
      - name: generated bindings are committed
        run: git diff --exit-code app/src/lib/bindings.ts

      - name: frontend build
        run: pnpm build
        working-directory: app

      - name: release-profile build
        run: cargo build --release --workspace

      - name: frontend unit tests
        run: pnpm test
        working-directory: app
